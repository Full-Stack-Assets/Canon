name: aoc-preflight

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  preflight-evidence:
    name: aoc-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Run static checks
        run: npm run static
      - name: Run lint when configured
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            echo "No lint script configured; skipping."
          fi
      - name: Verify repository enforcement bootstrap
        run: |
          set -euo pipefail
          ./enforcement/bootstrap.sh --install
          git diff --exit-code -- \
            .cursor/SYSTEM.md \
            .cursor/rules/aoc.mdc \
            .github/copilot-instructions.md
      - name: Require Preflight evidence on high-risk paths
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          HIGH='^(enforcement/|\.githooks/|\.github/workflows/|aoc/PORTFOLIO\.yaml)'
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD || true)"
          echo "$CHANGED"
          if ! echo "$CHANGED" | grep -Eq "$HIGH"; then
            echo "No high-risk paths in this PR."
            exit 0
          fi
          if echo "$PR_BODY" | grep -Eq '\[AOC/Canon • Preflight PASS\]|receipt[_ -]?id[[:space:]]*:'; then
            echo "Preflight evidence present."
            exit 0
          fi
          echo "High-risk paths changed without a [AOC/Canon • Preflight PASS] marker or receipt id in the PR body."
          exit 1
