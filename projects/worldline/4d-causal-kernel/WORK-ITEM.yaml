objective: >
  Make Worldline's deterministic causal kernel the only authority that can admit
  canonical world-state revisions while allowing AI coding agents to propose
  versioned executable transition mechanisms and generative renderers to depict
  admitted states without direct canonical mutation authority.
repository:
  implementation: Full-Stack-Assets/WorldGen
  design_branch: design/worldline-4d-causal-kernel-2026-08-27
  design_commit: 2a7eaa93d87ef876dadd96aa0b7ced8f70d19e05
