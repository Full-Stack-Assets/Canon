    repository canonical.
authority_ceiling: medium
data_classification: confidential
evidence_required:
  - Apple primary documentation for StoreKit, EventKit, UserNotifications, and App Review rules.
  - Repository commit hashes.
  - Automated parser, scheduler, deduplication, permission, and deletion test results.
  - Deployment and App Store receipts before any production claim.
exact_next_gate: Human review of the committed written specification, followed by an implementation plan.
